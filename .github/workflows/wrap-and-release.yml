name: Wrap and Release
on:
  push:
    branches: main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wrap-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect Version Number
        run: echo "VERSION_NUMBER=$(bash ./scripts/version-number-from-src.sh)" >> $GITHUB_ENV

      - name: Check For Existing Release
        id: check
        run: |
          if gh release view "v${VERSION_NUMBER}" > /dev/null 2>&1; then
            echo "::notice::Release v${VERSION_NUMBER} already exists. Bump VERSION_NUMBER in src/ArchHUD.lua to publish a new release."
            echo "exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release Notes
        if: steps.check.outputs.exists != 'true'
        run: |
          cat ./scripts/ReleaseNotesTemplate.md > ReleaseNotes.md
          bash ./scripts/latest-changes.sh >> ReleaseNotes.md

      # Zip layout mirrors autoconf/custom so players can extract it in place
      - name: Package ArchHUD.zip
        if: steps.check.outputs.exists != 'true'
        run: |
          mkdir -p package/archhud/custom
          cp ArchHUD.conf package/
          cp src/requires/*.lua src/requires/*.example src/requires/*.sample package/archhud/
          cp src/requires/custom/* package/archhud/custom/
          (cd package && zip -r ../ArchHUD.zip .)

      - name: Create Release
        if: steps.check.outputs.exists != 'true'
        run: |
          gh release create "v${VERSION_NUMBER}" ArchHUD.zip \
            --title "Release v${VERSION_NUMBER}" \
            --notes-file ReleaseNotes.md \
            --target "${GITHUB_SHA}"
